@startuml
skinparam backgroundColor white

start

:Anforderung erhalten;

if (Anforderung verstanden?) then (Ja)
  :Design umsetzen;
else (Nein)
  :Rückfrage stellen;

  while (Rückfrage verstanden\n&& Versuche < 5?) is (Nein) 
    :Rückfrage stellen; 
  endwhile (Ja) 

 
endif

stop

@enduml

